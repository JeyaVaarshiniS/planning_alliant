    cteString: ""
    enabledColumnTestIDs: []
    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: PLANNING_ALLIANT_STAGING
            nodeName: TMPBROKERLIST
          - locationName: PLANNING_ALLIANT_DBO
            nodeName: PLANNING_FCCS_BROKER
        join:
          joinCondition: |-
            FROM (
                WITH BROKERSTOMOVE AS (
                    SELECT
                        PLANNING_ID,
                        BROKER_NAME,
                        EXISTING_PARENT_PLANNING_ID,
                        EXISTING_GROUP_ID,
                        ROW_NUMBER() OVER (ORDER BY PLANNING_ID) AS ROW_NUM
                    FROM {{ ref('PLANNING_ALLIANT_STAGING', 'TMPBROKERLIST') }}
                ),
                TARGETGROUPSTATS AS (
                    SELECT
                        MAX(TRY_TO_NUMBER(SUBSTRING(PARENT_PLANNING_ID, 1, POSITION('_', PARENT_PLANNING_ID) - 1))) AS MAX_GROUP_ID,
                        COUNT(1) AS COUNT_OF_MAX_GROUP_ID
                    FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_BROKER') }}
                    WHERE TRY_TO_NUMBER(SUBSTRING(PARENT_PLANNING_ID, 1, POSITION('_', PARENT_PLANNING_ID) - 1)) = (SELECT MAX(TRY_TO_NUMBER(SUBSTRING(PARENT_PLANNING_ID, 1, POSITION('_', PARENT_PLANNING_ID) - 1))) FROM {{ ref('PLANNING_ALLIANT_DBO', 'PLANNING_FCCS_BROKER') }})
                ),
                SOURCEGROUPSTATS AS (
                    SELECT MAX(EXISTING_GROUP_ID) AS MAX_EXISTING_GROUP_ID FROM BROKERSTOMOVE
                ),
                CALCULATIONBASE AS (
                    SELECT
                        COALESCE(TGS.MAX_GROUP_ID, 0) AS MAX_GROUP_ID,
                        IFF(SGS.MAX_EXISTING_GROUP_ID = TGS.MAX_GROUP_ID, 0, TGS.COUNT_OF_MAX_GROUP_ID) AS EFFECTIVE_COUNT_OF_MAX_GROUP_ID,
                        IFF(TGS.MAX_GROUP_ID IS NOT NULL AND SGS.MAX_EXISTING_GROUP_ID <> TGS.MAX_GROUP_ID, 300 - IFF(SGS.MAX_EXISTING_GROUP_ID = TGS.MAX_GROUP_ID, 0, TGS.COUNT_OF_MAX_GROUP_ID), 0) AS SLOTS_IN_LAST_GROUP
                    FROM TARGETGROUPSTATS AS TGS
                    CROSS JOIN SOURCEGROUPSTATS AS SGS
                )
                SELECT
                    BTM.PLANNING_ID,
                    BTM.BROKER_NAME,
                    BTM.EXISTING_PARENT_PLANNING_ID,
                    BTM.EXISTING_GROUP_ID,
                    CASE
                        WHEN BTM.ROW_NUM <= CB.SLOTS_IN_LAST_GROUP THEN CB.MAX_GROUP_ID
                        ELSE (CB.MAX_GROUP_ID + 1) + FLOOR((BTM.ROW_NUM - CB.SLOTS_IN_LAST_GROUP - 1) / 300)
                    END AS NEW_PARENT_GROUP_ID,
                    CONCAT(
                        CASE
                            WHEN BTM.ROW_NUM <= CB.SLOTS_IN_LAST_GROUP THEN CB.MAX_GROUP_ID
                            ELSE (CB.MAX_GROUP_ID + 1) + FLOOR((BTM.ROW_NUM - CB.SLOTS_IN_LAST_GROUP - 1) / 300)
                        END, '_Producer_Parent') AS NEW_PARENT_PLANNING_ID,
                    IFF(
                        (CASE WHEN BTM.ROW_NUM <= CB.SLOTS_IN_LAST_GROUP THEN CB.MAX_GROUP_ID ELSE (CB.MAX_GROUP_ID + 1) + FLOOR((BTM.ROW_NUM - CB.SLOTS_IN_LAST_GROUP - 1) / 300) END) > CB.MAX_GROUP_ID, 'Y', 'N') AS NEW_PARENT_FLAG
                FROM BROKERSTOMOVE AS BTM
                CROSS JOIN CALCULATIONBASE AS CB
            ) AS T
        name: BROKER_PARENT_ASSIGNMENTS
